[package]
name = "course_examples"
version = "0.1.0"
edition = "2021"
description = "Every code example from the Learn Rust in 12 Weeks course, as tested Rust."

[dependencies]
futures = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync"] }

[dev-dependencies]
tempfile = "3"
